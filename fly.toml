# fly.toml — Review Leads en Fly.io
# App: review-leads | Región: gru | URL: https://review-leads.fly.dev/
#
# IMPORTANTE SQLite/CRM:
#   - Usar UNA sola máquina: fly scale count 1 -a review-leads
#   - DATABASE_PATH=/tmp/review-leads.db (efímero; ver README para volumen /data)
#
# Deploy: fly deploy --depot=false -a review-leads
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'review-leads'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
