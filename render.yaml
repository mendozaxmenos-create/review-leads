services:
  - type: web
    name: review-leads
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DEBUG
        value: "false"
      - key: DATABASE_PATH
        value: /tmp/review-leads.db
      - key: CACHE_TTL_HOURS
        value: "24"
    # Nota: plan free NO tiene disco persistente. SQLite vive en /tmp y se
    # resetea al reiniciar o redeployar. Para historial/CRM permanente hace
    # falta plan de pago + disk, o una DB externa.
