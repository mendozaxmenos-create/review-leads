# Render — referencia de env / Blueprint
# Deploy real: Public Git → https://github.com/mendozaxmenos-create/review-leads (main)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: review-leads
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DEBUG
        value: "false"
      - key: DATABASE_PATH
        value: /tmp/review-leads.db
      - key: CACHE_TTL_HOURS
        value: "24"
      - key: OUTREACH_SENDER_NAME
        value: Gustavo
      - key: OUTREACH_SENDER_COMPANY
        value: SofIA
      - key: NOMINATIM_CONTACT_EMAIL
        sync: false
      - key: DEMO_PUBLIC_URL
        value: https://review-leads.onrender.com
      - key: DASHBOARD_ACCESS_TOKEN
        sync: false
    # Keep-alive gratis: UptimeRobot → GET https://review-leads.onrender.com/health cada 5 min
    # (si no, el plan free duerme ~15 min sin tráfico).
    # Plan free: sin disco persistente. SQLite en /tmp se resetea al reiniciar.
    # Para CRM permanente: plan pago + disk o DB externa (PostgreSQL, Turso, etc.).
