# Render Blueprint — https://render.com/docs/blueprint-spec
# Conectar repo: schejtergustavo/review-leads → New → Blueprint
services:
  - type: web
    name: review-leads
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DEBUG
        value: "false"
      - key: DATABASE_PATH
        value: /tmp/review-leads.db
      - key: CACHE_TTL_HOURS
        value: "24"
      - key: OUTREACH_SENDER_NAME
        value: Gustavo
      - key: OUTREACH_SENDER_COMPANY
        value: SofIA
      - key: NOMINATIM_CONTACT_EMAIL
        sync: false
    # Plan free: sin disco persistente. SQLite en /tmp se resetea al reiniciar.
    # Para CRM permanente: plan pago + disk o DB externa (PostgreSQL, Turso, etc.).
